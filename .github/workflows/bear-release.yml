name: Bear Windows release
on:
  push:
    branches: [main]
    paths: ['shy-bear/**', '.github/workflows/bear-release.yml']
  pull_request:
    paths: ['shy-bear/**', '.github/workflows/bear-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bear-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: shy-bear
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: shy-bear/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check Python sources
        run: python -m compileall -q source tests
      - name: Test updater integrity and timing
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm Bear.spec
      - name: Smoke test packaged application
        run: |
          $report=Join-Path $PWD 'smoke.json'
          $process=Start-Process -FilePath (Join-Path $PWD 'dist/Bear.exe') -ArgumentList @('--self-test',('"'+$report+'"')) -PassThru -WindowStyle Hidden -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'EXE smoke test failed' }
          if (!(Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'EXE resources failed' }
      - name: Prepare download
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/Bear.exe release/Bear.exe
          Copy-Item README.txt release/README.txt
          $hash=(Get-FileHash release/Bear.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Bear.exe" | Set-Content release/SHA256.txt -Encoding ascii
          Compress-Archive -Path release/Bear.exe,release/README.txt,release/SHA256.txt -DestinationPath release/Bear-Windows.zip
          python -c "import sys;sys.path.insert(0,'source');from updater import VERSION;print('BEAR_TAG=bear-v'+VERSION)" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Bear-Windows
          path: shy-bear/release/*
      - name: Publish verified release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:BEAR_TAG *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'This version is already published'; exit 0 }
          gh release create $env:BEAR_TAG release/Bear.exe release/Bear-Windows.zip release/SHA256.txt --draft --target $env:GITHUB_SHA --title "Мишка $env:BEAR_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:BEAR_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }


